<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

</head>

<style>
        body {
            background-color: #ffe6f0;
            font-family:'Arial', sans-serif;
            color: #4a2c3a;
        }

        .main-card {
            background-color: #ffffff;
            border: 3px solid #ffb3d9;
            border-radius: 15px;
            padding: 25px;
            max-width: 650px;
            margin: auto;
        }

        h1 {
            color: #d63384;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px #ffc0cb;
        }

        .custom-input {
            border: 2px solid #ff99c8;
            border-radius: 10px;
            background-color: #fff5f8;
        }

        .custom-input:focus {
            border-color: #d63384;
            box-shadow: 0 0 5px rgba(214, 51, 132, 0.5);
            background-color: #ffffff;
        }

        .btn-add {
            background-color: #ff66b2;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
        }

        .btn-remove {
            background-color: #ff4d6d;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
        }

        .member-section {
            background-color: #fff0f5;
            border: 2px dashed #ff80bf;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }

        #output div {
            background-color: #ffffff;
            border: 1px solid #ffb6c1;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 6px;
            color: #5c0033;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }

        .text-pink-success {
            color: #d63384;
        }

        .text-pink-warning {
            color: #b30059;
        }

        .text-pink-danger {
            color: #990033;
        }
    </style>

<body class="container mt-5">

<h1>Communication Arts Club</h1>
<p>Enter member name to add or remove:</p>

    <input type="text" id="user_input" placeholder="Enter First Name" class="form-control mb-3">
    <input type="text" id="user_input" placeholder="Enter Last Name" class="form-control mb-3">

<button type="button" class="btn btn-success" py-click = "append_value">ADD MEMBER</button>
<button type="button" class="btn btn-danger" py-click = "remove_value">REMOVE MEMBER</button>
    
<h3 class="mt-4">Members:</h3>
<div id="output"></div>
    
<p id="message"></p>
<py-script src="main.py"></py-script>

</body>
</html>
